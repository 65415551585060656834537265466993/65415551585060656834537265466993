<script>
const SYM=["– –","–","○","+","+ +","S.O"];
const DEF={"1": "Les critères d’octroi des crédits: Les critères d’octroi des crédits sont les directives ou les critères internes selon lesquels votre banque octroie les crédits. Ils définissent les crédits que votre banque est prête à octroyer et ceux qu’elles ne souhaitent pas octroyer, les priorités sectorielles, les garanties jugées recevables et celles jugées irrecevables, etc. Les critères d'octroi déterminent les caractéristiques spécifiques requises de l’emprunteur pour l'obtention d'un crédit. Ces critères d'octroi peuvent varier à la suite de modifications du coût des ressources, des conditions de la concurrence, de la perception du risque, de la tolérance au risque et de la réglementation etc.", "2": "Crédits à court terme : Les crédits à court terme ont une durée initiale égale ou inférieure à un an.", "3": "Crédits à moyen et long terme : les crédits à long terme ont une durée initiale supérieure à un an.", "4": "S.O : La réponse « Sans opinion » renvoie à une situation d’absence d’activité ou d’exposition à la catégorie de prêts concernée. Elle décrit une situation où aucun nouveau crédit, dans la catégorie de prêts concernée, est adressé à la banque.", "5": "Coûts des ressources et contraintes d’équilibre du bilan: Les fonds propres de la banque et les coûts liés à ses ressources peuvent devenir une contrainte de bilan susceptible d’entraver l’expansion de la distribution de crédits. Pour un niveau donné de fonds propres, l'offre des crédits par la banque pourrait être affectée par sa position de liquidité et sa capacité d’accès au marché monétaire et à l’émission des titres de créance.", "6": "Perception des risques : La perception des risques fait référence à la perception par la banque des risques réels et à sa réaction aux évolutions liées à la situation économique et ses perspectives, à la situation et aux perspectives spécifiques du secteur ou de l’entreprise, à la solvabilité de l'emprunteur ainsi qu'aux exigences de garanties (éléments liés à la demande).", "7": "Tolérance au risque: La tolérance au risque fait référence à la tolérance au risque de la banque dans sa politique de crédit ; cette tolérance peut varier en fonction des changements dans la stratégie commerciale de la banque (éléments liés à l’offre). La perception que les banques ont du risque réel et leur tolérance au risque peuvent soit évoluer en parallèle, soit évoluer dans des directions différentes.", "8": "Les conditions d'octroi des crédits : Les conditions d'octroi des crédits sont les conditions du crédit réellement approuvé telles qu'elles sont énoncées dans le contrat de prêt dans le contrat de prêt conclu entre la banque (le prêteur) et l'emprunteur. Elles consistent généralement de la marge convenue par rapport au taux de référence, le montant du crédit, les conditions d'accès ainsi que d'autres conditions spécifiques pouvant prendre la forme de frais autres que les intérêts (exemple : les commissions), les sûretés ou les garanties que l'emprunteur doit apporter (y compris les dépôts de garantie), les clauses incluses dans les contrats de crédit et la durée convenue des crédits. Les conditions d'octroi des crédits dépendent des caractéristiques de l'emprunteur et peuvent varier en fonction ou indépendamment des critères d'octroi des crédits. Par exemple, une augmentation du coût des ressources de la banque ou une détérioration des perspectives économiques générales peut entraîner à la fois un durcissement des critères d'octroi des crédits et un durcissement des conditions d'octroi des crédits que la banque est prête à octroyer et que ses clients sont prêts à accepter. La banque peut modifier ses conditions d'octroi des crédits (et accroître, par exemple, la marge requise pour couvrir le coût) et laisser inchangés ses critères d'octroi.", "9": "Marges : La marge sur les prêts d'une banque est la marge par rapport au taux du marché monétaire (TMM). Cette marge couvrirait les variations des taux débiteurs des banques liées principalement aux variations du coût de leurs ressources et du risque emprunteur. De façon détaillée, la marge couvrirait les variations de la prime de risque de la banque dans son propre coût de financement sur le marché, les variations de leur coût de financement par les dépôts, les variations dans l'évaluation par la banque du risque emprunteur ainsi que les variations de tout facteur supplémentaire non lié aux variations des taux du marché. Pour les réponses, veuillez noter (durcissement= marge accrue, assouplissement=marge plus faible)", "10": "Frais et commissions autres que les intérêts : Il s’agit de différents types de commissions qui peuvent être inclues dans le prix d’un crédit, tels que les frais administratifs (les frais de dossier…), les frais d’enquête, de garantie et d’assurance-crédit, etc.", "11": "Demandes de garanties : C’est la sûreté donnée par un emprunteur à un prêteur en nantissement pour le remboursement d’un crédit. Il s’agit de certaines sûretés financières, comme des titres de propriété ou des titres de créance, de biens immobiliers ou de dépôts de garantie.", "12": "Clauses dans les contrats de crédit : Une clause est un accord ou une disposition expresse figurant dans un contrat de crédit, conclu en particulier avec des entreprises, par laquelle l’emprunteur est tenu d’une obligation de faire ou de ne pas faire (exemple : vendre un bien immobilier).", "13": "La demande : Le terme demande désigne toutes les demandes de crédit formellement adressées à la banque ainsi que toute demande ne pouvant pas encore être considérée comme telle. Si des informations ne peuvent être obtenues sur les demandes de crédit non encore formalisées, la réponse de la banque devrait au moins porter sur l'ensemble des demandes qui lui ont été formellement adressées. Les demandes de crédit peuvent émaner de nouveaux clients ou de clients existants de la banque. Les demandes de crédit émanant des clients existants ne doivent être comprises que si le montant du crédit existant augmente ou si un nouveau crédit est accordé.", "14": "Les demandes de prêts rejetées : Le « refus de crédit » a trait au rejet de l'encours de demandes de crédits formelles ou des demandes de crédit non formalisées. Si des informations ne peuvent être obtenues sur les refus de crédit, la réponse de la banque devrait au moins porter sur l'ensemble des demandes qui lui ont été formellement adressées et qui ont été rejetées. Il convient de se référer à l'encours de refus de crédits par rapport à l'encours des demandes de crédit. Les refus de crédit ne couvrent pas la situation dans laquelle l'emprunteur retire une demande en raison de conditions pratiquées par la banque jugées défavorables.", "15": "Refinancement/restructuration et renégociation de dettes: Cet élément, conduisant à l'augmentation du montant emprunté ou à la prolongation de la durée du crédit, couvre notamment le recours à la restructuration des dettes pour éviter le non-remboursement d'une dette existante (ce qui est interprété comme une hausse de la demande), par exemple à travers la prolongation de la durée du crédit afin d'éviter d'éventuelles difficultés de paiement à l'échéance. Au même temps, pour évaluer les variations de la demande de crédits, cet élément ne doit pas inclure le refinancement, la restructuration et/ou la renégociation de dettes conduisant uniquement à une modification des conditions d'octroi du crédit autre que le montant du crédit ou sa durée."};
const Q=[{"n": 1, "t": "Au cours des trois derniers mois, comment ont évolué vos critères d’octroi [1] de crédits ou de lignes de crédit aux entreprises ?", "h": "I. Crédits ou lignes de crédit accordés aux entreprises (Offre)", "k": "g", "x": "Ces critères", "o": ["se sont sensiblement durcis", "se sont quelque peu durcis", "Pas de changement", "se sont quelque peu assouplis", "se sont sensiblement assouplis"], "r": ["Orientation Globale", "Crédits aux PME", "Crédits aux grandes entreprises", "Crédits à court terme", "Crédits à long terme"]}, {"n": 2, "t": "Au cours des trois derniers mois, de quelle manière les éléments ci-dessous ont-ils impacté vos critères de décisions concernant l'attribution de crédits ou de lignes de crédit aux entreprises (comme indiqué dans la question 1) ?", "p": "Pouvez-vous évaluer chaque élément en utilisant l’échelle suivante ?", "k": "f", "c": ["Incidence globale sur les critères d'octroi des crédits de votre banque", "Incidence sur les critères d'octroi de votre banque pour les crédits aux petites et moyennes entreprises", "Incidence sur les critères d'octroi de votre banque pour les crédits aux grandes entreprises"], "r": ["#A) Coûts des ressources et contraintes d’équilibre du bilan : [5]", "Coûts liés aux fonds propres de votre banque", "Capacité de votre banque à accéder aux financements de marché", "Position de liquidité de votre banque", "#B) Pression concurrentielle :", "Concurrence d’autres banques", "Concurrence d’institutions non bancaires", "#C) Perception des risques [6] :", "Prévisions concernant l’activité économique générale", "Perspectives spécifiques concernant le secteur ou les entreprises", "Risques relatifs aux garanties requises", "Tolérance au risque de votre banque [7]"], "l": "– – : ont contribué sensiblement au durcissement des critères · – : ont contribué dans une certaine mesure au durcissement des critères · ○ : ont contribué à un maintien des critères · + : ont contribué dans une certaine mesure à assouplir les critères · + + : ont contribué sensiblement à assouplir les critères · S.O : Sans Opinion [4]"}, {"n": 3, "t": "Au cours des trois derniers mois, comment ont évolué les conditions d’octroi [8] appliquées aux nouveaux crédits ou lignes de crédit aux entreprises ?", "p": "Pouvez-vous évaluer chaque élément en utilisant l’échelle suivante ? Les conditions d'octroi (se) sont:", "k": "f", "c": ["Orientation Globale", "Prêts aux petites et moyennes entreprises", "Prêts aux grandes entreprises"], "r": ["#A) Conditions globales :", "L’orientation globale des conditions d’octroi des crédits", "#B) Marges [9] :", "La marge appliquée sur les prêts", "#C) Autres conditions d’octroi des crédits", "Frais et commissions autres que les intérêts [10]", "Montant du crédit ou de la ligne de crédit", "Demandes de garanties [11]", "Durée", "Clauses dans les contrats de crédit [12]"], "l": "– – : sensiblement durcies · – : quelque peu durcies · ○ : restés à peu près inchangées · + : quelque peu assouplies · + + : sensiblement assouplies · S.O : Sans Opinion"}, {"n": 4, "t": "Au cours des trois derniers mois, de quelle manière les éléments ci-dessous ont-ils modifié les conditions de décision concernant l’attribution de nouveaux crédits ou de lignes de crédit aux entreprises (comme indiqué dans la question 3) ?", "p": "Veuillez évaluer l’incidence de ces éléments sur le durcissement ou l’assouplissement des conditions d’octroi en utilisant l’échelle suivante :", "k": "f", "c": ["Incidence globale sur les conditions d'octroi de crédits de votre banque", "Incidence sur la marge de votre banque sur les prêts", "Incidence sur les frais et commissions autres que les intérêts"], "r": ["#A) Coûts des ressources et contraintes d’équilibre du bilan :", "Coûts liés aux fonds propres de votre banque", "Capacité de votre banque à accéder aux financements de marché", "Position de liquidité de votre banque", "#B) Pression concurrentielle :", "Concurrence d’autres banques", "Concurrence d’instituions non bancaires", "#C) Perception des risques :", "Prévisions concernant l’activité économique générale", "Perspectives spécifiques concernant le secteur ou les entreprises", "Risques relatifs aux garanties requises", "Tolérance au risque de votre banque"], "l": "– – : a contribué sensiblement (à durcir ces conditions / à un rehaussement des marges) · – : a contribué quelque peu (à durcir ces conditions / à un rehaussement des marges) · ○ : a contribué (à un maintien de ces conditions / à un maintien des marges) · + : a contribué quelque peu (à assouplir ces conditions / à une réduction des marges) · + + : a contribué sensiblement (à assouplir ces conditions / à une réduction des marges) · S.O : Sans Opinion"}, {"n": 5, "t": "Au cours des trois derniers mois, (abstraction faite des fluctuations saisonnières habituelles) de quelle manière a évolué la demande [13] de crédits ou de lignes de crédit des entreprises adressée à votre banque ?", "h": "II. Crédits et lignes de crédit accordés aux entreprises (Demande)", "k": "g", "x": "", "o": ["a sensiblement diminué", "a diminué quelque peu", "est restée à peu près inchangée", "a augmenté quelque peu", "a sensiblement augmenté", "S.O"], "r": ["Orientation Globale", "Crédits aux PME", "Crédits aux grandes entreprises", "Crédits à court terme", "Crédits à long terme"]}, {"n": 6, "t": "Au cours des trois derniers mois, (abstraction faite des fluctuations saisonnières habituelles) comment a évolué la part des demandes de prêt aux entreprises [13] qui ont été complètement rejetées [14] par votre banque ?", "k": "g", "x": "", "o": ["a sensiblement diminué", "a diminué quelque peu", "est restée à peu près inchangée", "a augmenté quelque peu", "a sensiblement augmenté", "S.O"], "r": ["Orientation Globale", "Crédits aux PME", "Crédits aux grandes entreprises", "Crédits à court terme", "Crédits à long terme"]}, {"n": 7, "t": "Au cours des trois derniers mois, de quelle manière les éléments ci-dessous ont-ils affecté la demande globale de crédits ou de lignes de crédit émanant des entreprises (comme indiqué dans la question 5) ?", "p": "Veuillez évaluer chaque élément en utilisant la grille suivante :", "k": "f", "c": ["Demande globale"], "r": ["#A) Besoins de financement/facteurs sous-jacents ou objet de la demande de crédit", "Investissement (Capital fixe)", "Gestion des stocks et fonds de roulement", "Niveau et perception des taux d'intérêt", "Refinancement/restructuration et renégociation de dettes [15]", "#B) Recours à d’autres modes de financement", "Financements internes", "Prêts d’autres banques", "Prêts accordés par des institutions non bancaires", "#C) Autres facteurs (à préciser)", "?Autre élément (à préciser)"], "l": "– – : a/ont contribué sensiblement à faire diminuer la demande · – : a/ont contribué quelque peu à faire diminuer la demande · ○ : a/ont contribué à maintenir la demande à peu près inchangée · + : a/ont contribué quelque peu à accroître la demande · + + : a/ont contribué sensiblement à accroître la demande · S.O : Sans Opinion"}, {"n": 8, "t": "Pour les trois prochains mois, comment va évoluer la politique de votre banque en matière d’octroi de crédits ou de lignes de crédit aux entreprises? Veuillez noter que la question porte sur l'évolution des critères d'octroi.", "h": "III. Crédits et lignes des crédits accordés aux entreprises (Perspectives)", "p": "Les critères devraient :", "k": "g", "x": "", "o": ["se durcir sensiblement", "se durcir quelque peu", "rester à peu près inchangés", "s’assouplir quelque peu", "s’assouplir sensiblement", "S.O"], "r": ["Orientation Globale", "Crédits aux PME", "Crédits aux grandes entreprises", "Crédits à court terme", "Crédits à long terme"]}, {"n": 9, "t": "Pour les trois prochains mois, comment va évoluer la demande de crédits ou de lignes de crédit des entreprises adressée à votre banque (abstraction faite des fluctuations saisonnières habituelles) ?", "p": "La demande devrait :", "k": "g", "x": "", "o": ["diminuer sensiblem
